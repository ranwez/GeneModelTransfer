# Mandatory inputs
target_genome: "DATA/target.fasta"
ref_gff: "DATA/ref.gff"
ref_locus_info: "DATA/info_locus.tsv"

# Reference source: provide exactly one of ref_genome or lrrome
ref_genome: "DATA/ref.fasta"
lrrome: null

# Optional precomputed BLAST results
tblastn_results: null
blastn_results: null

# Candidate locus parameters
CL_min_sim: 0.25

# Workflow behavior
ignore_exonerate_errors: false

# Outputs
out_dirname: "results"
out_feature_id_prefix: "LRRt"
