$schema: "http://json-schema.org/draft-07/schema#"

title: LRRtransfer configuration
description: Configuration schema for the LRRtransfer workflow.

type: object
additionalProperties: false

properties:
  singularity_image:
    type: string
    minLength: 1
    default: "docker://ghcr.io/johgi/genemodeltransfer-deps:0.4.0"
    description: >
      Container image used by the workflow. By default, LRRtransfer uses
      the dependency image published on GHCR. A local Apptainer/Singularity
      image path can be provided to override the default.

  target_genome:
    type: string
    minLength: 1
    description: Path to the target genome FASTA file.

  ref_genome:
    type:
      - string
      - "null"
    minLength: 1
    default: null
    description: >
      Path to the reference genome FASTA file.
      Mutually exclusive with lrrome.

  lrrome:
    type:
      - string
      - "null"
    minLength: 1
    default: null
    description: >
      Path to a prebuilt LRRome.
      Mutually exclusive with ref_genome.

  ref_gff:
    type: string
    minLength: 1
    description: Path to the reference GFF file.

  ref_locus_info:
    type:
      - string
      - "null"
    minLength: 1
    default: null
    description: Path to the reference locus information TSV file.

  tblastn_results:
    type:
      - string
      - "null"
    minLength: 1
    default: null
    description: >
      Optional precomputed TBLASTN results.
      If omitted, TBLASTN results are generated by the workflow.

  blastn_results:
    type:
      - string
      - "null"
    minLength: 1
    default: null
    description: >
      Optional precomputed BLASTN results.
      If omitted, BLASTN results are generated by the workflow.

  CL_min_sim:
    type: number
    minimum: 0
    maximum: 1
    default: 0.25
    description: Minimum similarity required to retain a candidate locus.

  ignore_exonerate_errors:
    type: boolean
    default: false
    description: Whether unexpected Exonerate errors should be ignored.

  out_dirname:
    type: string
    minLength: 1
    default: results
    description: Workflow output directory.

  out_feature_id_prefix:
    type: string
    minLength: 1
    default: LRRt
    description: Prefix used for output feature identifiers.

required:
  - target_genome
  - ref_gff

oneOf:
  - required:
      - ref_genome
    properties:
      ref_genome:
        type: string
        minLength: 1
      lrrome:
        type: "null"

  - required:
      - lrrome
    properties:
      ref_genome:
        type: "null"
      lrrome:
        type: string
        minLength: 1
